<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexaBull | Register Account</title>
    <meta name="description" content="Create your NexaBull trading account. Sign up in minutes." />
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: #021a1f;
        }

        #auth-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: linear-gradient(160deg, rgba(0, 60, 80, 0.55) 0%, rgba(0, 120, 140, 0.45) 30%, rgba(0, 100, 120, 0.4) 60%, rgba(2, 20, 35, 0.7) 100%);
            pointer-events: none;
        }

        .float-nums {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .fn {
            position: absolute;
            font-family: monospace;
            font-size: 13px;
            font-weight: 700;
            animation: floatNum 7s ease-in-out infinite alternate;
            user-select: none;
        }

        @keyframes floatNum {
            from {
                transform: translateY(0);
                opacity: 0.5;
            }

            to {
                transform: translateY(-18px);
                opacity: 0.8;
            }
        }

        .bull-left,
        .bull-right {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            width: 380px;
            height: 380px;
            pointer-events: none;
            opacity: 0.8;
        }

        .bull-left {
            left: -40px;
        }

        .bull-right {
            right: -40px;
            transform: translateY(-50%) scaleX(-1);
        }

        /* ── SCROLLABLE CARD WRAPPER ── */
        .auth-card {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 30px 20px 40px;
        }

        .auth-box {
            background: rgba(8, 22, 45, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 44px 44px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 16px;
        }

        .auth-logo img {
            height: 58px;
        }

        .auth-shield {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: rgba(0, 180, 100, 0.1);
            border: 2px solid rgba(0, 200, 100, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .auth-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 24px;
        }

        .auth-title span {
            color: #f5c518;
        }

        /* Grid for 2-column rows */
        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 600;
            color: #c8d8e8;
            margin-bottom: 7px;
        }

        .field-label span {
            font-size: 14px;
        }

        .field-wrap {
            position: relative;
        }

        .field-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 40px 12px 42px;
            font-size: 13px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .field-input::placeholder {
            color: rgba(255, 255, 255, 0.28);
        }

        .field-input:focus {
            border-color: rgba(0, 212, 232, 0.5);
        }

        .field-input.no-prefix {
            padding-left: 14px;
        }

        .field-prefix {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            pointer-events: none;
        }

        .field-suffix {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .field-suffix:hover {
            opacity: 1;
        }

        /* Sponsor name — read-only */
        .field-input[readonly] {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Captcha row */
        .captcha-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .captcha-img-wrap {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .captcha-img-wrap img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .captcha-reload {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 212, 232, 0.15);
            border: 1px solid rgba(0, 212, 232, 0.3);
            color: #00d4e8;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .captcha-reload:hover {
            background: rgba(0, 212, 232, 0.25);
            transform: rotate(180deg);
        }

        /* Terms */
        .terms-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0 20px;
        }

        .terms-row input[type=checkbox] {
            width: 16px;
            height: 16px;
            accent-color: #f5c518;
            cursor: pointer;
            flex-shrink: 0;
        }

        .terms-row label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }

        .terms-row a {
            color: #f5c518;
            text-decoration: none;
        }

        /* Submit */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #f5c518, #e0a800);
            color: #000;
            font-size: 14px;
            font-weight: 800;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s;
            box-shadow: 0 6px 24px rgba(245, 197, 24, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(245, 197, 24, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Alert */
        .auth-alert {
            font-size: 12px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: none;
        }

        .auth-alert.show {
            display: block;
        }

        .auth-alert.error {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            color: #ff6b6b;
        }

        .auth-alert.success {
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: #00e676;
        }

        .auth-footer-link {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .auth-footer-link a {
            color: #f5c518;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 560px) {
            .auth-box {
                padding: 24px 16px 32px;
            }

            .field-row {
                grid-template-columns: 1fr;
            }

            .bull-left,
            .bull-right {
                width: 200px;
                height: 200px;
                opacity: 0.35;
            }
        }
    </style>
</head>

    <script>
        const API = '/api';
        let regSession = '';

        /* ── Canvas ── */
        (function () {
            const canvas = document.getElementById('auth-canvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
            resize(); window.addEventListener('resize', resize);
            const nodes = Array.from({ length: 70 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5, r: Math.random() * 1.5 + .5 }));
            function frame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                g.addColorStop(0, '#02333d'); g.addColorStop(.5, '#015062'); g.addColorStop(1, '#011520');
                ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y, d = Math.sqrt(dx * dx + dy * dy);
                        if (d < 160) { ctx.strokeStyle = `rgba(0,230,200,${(1 - d / 160) * .3})`; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke(); }
                    }
                    ctx.beginPath(); ctx.arc(nodes[i].x, nodes[i].y, nodes[i].r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,220,200,.7)'; ctx.fill();
                    nodes[i].x += nodes[i].vx; nodes[i].y += nodes[i].vy;
                    if (nodes[i].x < 0 || nodes[i].x > canvas.width) nodes[i].vx *= -1;
                    if (nodes[i].y < 0 || nodes[i].y > canvas.height) nodes[i].vy *= -1;
                }
                requestAnimationFrame(frame);
            }
            frame();
        })();

        /* ── Floating numbers ── */
        (function () {
            const nums = [{ v: '48,900', c: '#00cc99' }, { v: '(+24.90)', c: '#00cc99' }, { v: '+0.936402', c: '#00e676' }, { v: '+0.32', c: '#00cc80' }, { v: '36,900', c: '#00cc99' }, { v: '(+45.18)', c: '#00e676' }, { v: '▲ -54.62', c: '#ff6b6b' }, { v: '+40.66', c: '#00e676' }, { v: '▼ -23%', c: '#ff6b6b' }, { v: '400.05146', c: '#00cc99' }, { v: '(-18.68)', c: '#ff6b6b' }, { v: '(-16.24)', c: '#ff6b6b' }, { v: '-4871.81', c: '#ff6b6b' }, { v: 'BTC/USD', c: 'rgba(0,200,180,.5)' }, { v: '68,945', c: '#00cc99' }, { v: 'XAU/USD', c: 'rgba(0,200,180,.5)' }, { v: '2,345.80', c: '#00cc99' }, { v: '-5134', c: '#ff6b6b' },];
            const c = document.getElementById('float-nums');
            nums.forEach(n => { const el = document.createElement('div'); el.className = 'fn'; el.textContent = n.v; el.style.color = n.c; el.style.fontSize = (Math.random() * 5 + 10) + 'px'; el.style.left = (Math.random() * 85) + '%'; el.style.top = (Math.random() * 85) + '%'; el.style.animationDelay = (Math.random() * 5) + 's'; el.style.animationDuration = (6 + Math.random() * 6) + 's'; c.appendChild(el); });
        })();

        /* ── Password toggle ── */
        function togglePw(id, btn) { const inp = document.getElementById(id); const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; btn.textContent = show ? '🙈' : '👁️'; }

        /* ── Sponsor lookup ── */
        let sponsorDebounce;
        document.getElementById('reg-sponsor-id').addEventListener('input', function () {
            clearTimeout(sponsorDebounce);
            const val = this.value.trim();
            if (!val) { document.getElementById('reg-sponsor-name').value = ''; return; }
            sponsorDebounce = setTimeout(async () => {
                if (val.toUpperCase() === 'ADMIN') { document.getElementById('reg-sponsor-name').value = 'Admin'; return; }
                try {
                    const res = await fetch(`${API}/user/lookup?userId=${encodeURIComponent(val)}`);
                    if (res.ok) { const d = await res.json(); document.getElementById('reg-sponsor-name').value = d.data?.name || 'Not Found'; }
                    else { document.getElementById('reg-sponsor-name').value = 'Not Found'; }
                } catch { document.getElementById('reg-sponsor-name').value = ''; }
            }, 600);
        });

        /* ── Captcha ── */
        async function loadCaptcha() {
            try {
                const res = await fetch(API + '/auth/captcha');
                const d = await res.json();
                if (d.success) { document.getElementById('reg-captcha-img').src = d.captchaImage; regSession = d.sessionId; }
            } catch { genFallbackCaptcha(); }
        }
        function genFallbackCaptcha() {
            const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; let code = '';
            for (let i = 0; i < 6; i++)code += chars[Math.floor(Math.random() * chars.length)];
            regSession = 'fallback:' + code;
            const c = document.createElement('canvas'); c.width = 160; c.height = 44;
            const ctx = c.getContext('2d'); ctx.fillStyle = '#f0f4f8'; ctx.fillRect(0, 0, 160, 44);
            for (let i = 0; i < 5; i++) { ctx.strokeStyle = 'rgba(100,150,200,.3)'; ctx.beginPath(); ctx.moveTo(Math.random() * 160, Math.random() * 44); ctx.lineTo(Math.random() * 160, Math.random() * 44); ctx.stroke(); }
            code.split('').forEach((ch, i) => { ctx.save(); ctx.font = `bold ${18 + Math.random() * 4}px Arial`; ctx.fillStyle = ['#1a6cf5', '#0e5ca0', '#2baee0', '#14527a'][Math.floor(Math.random() * 4)]; ctx.translate(12 + i * 24 + Math.random() * 4 - 2, 30 + Math.random() * 6 - 3); ctx.rotate((Math.random() * 20 - 10) * Math.PI / 180); ctx.fillText(ch, 0, 0); ctx.restore(); });
            document.getElementById('reg-captcha-img').src = c.toDataURL();
        }
        document.getElementById('reg-captcha-reload').addEventListener('click', loadCaptcha);
        loadCaptcha();

        /* ── Alert ── */
        function showAlert(id, msg, type) { const el = document.getElementById(id); el.textContent = msg; el.className = 'auth-alert ' + type + ' show'; setTimeout(() => el.className = 'auth-alert', 5000); }

        /* ── Register ── */
        async function doRegister() {
            const sponsorId = document.getElementById('reg-sponsor-id').value.trim();
            const sponsorName = document.getElementById('reg-sponsor-name').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm').value;
            const captchaCode = document.getElementById('reg-captcha-input').value.trim();
            const terms = document.getElementById('reg-terms').checked;

            if (!name || !email || !mobile || !password || !confirmPassword || !captchaCode) { showAlert('reg-alert', 'Please fill in all required fields.', 'error'); return; }
            if (password !== confirmPassword) { showAlert('reg-alert', 'Passwords do not match.', 'error'); return; }
            if (password.length < 6) { showAlert('reg-alert', 'Password must be at least 6 characters.', 'error'); return; }
            if (!terms) { showAlert('reg-alert', 'You must agree to the Terms & Conditions.', 'error'); return; }
            if (regSession.startsWith('fallback:')) {
                if (captchaCode.toLowerCase() !== regSession.split(':')[1].toLowerCase()) { showAlert('reg-alert', 'Invalid captcha. Please try again.', 'error'); loadCaptcha(); return; }
            }

            const btn = document.getElementById('reg-btn');
            btn.disabled = true; btn.textContent = '⌛ Creating Account...';
            try {
                const res = await fetch(API + '/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sponsorId, sponsorName, name, email, mobile, password, confirmPassword, captchaCode, captchaSessionId: regSession }) });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('nb_token', data.token);
                    localStorage.setItem('nb_user', JSON.stringify(data.data?.user));
                    showAlert('reg-alert', '✅ Account created! Redirecting to dashboard...', 'success');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                } else { showAlert('reg-alert', data.message || 'Registration failed. Please try again.', 'error'); loadCaptcha(); }
            } catch { showAlert('reg-alert', 'Cannot connect to server. Please ensure the backend is running.', 'error'); }
            finally { btn.disabled = false; btn.innerHTML = '⚡ Create Account'; }
        }
    </script>
</body>
